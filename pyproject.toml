[project]
name = "marula-data-platform"
version = "0.1.0"
description = "A self-hosted data platform for learning modern data engineering."
readme = "README.md"
requires-python = ">=3.13,<3.14"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
marula-pipeline = "marula_data_platform.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
